<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Debbie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#120a2e;
    --bg-2:#2a1150;
    --bg-3:#4a1259;
    --pink:#ff2e9e;
    --cyan:#2ee6ff;
    --gold:#ffd93d;
    --violet:#b18fff;
    --cream:#fff8f0;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: radial-gradient(ellipse at 20% 20%, var(--bg-3), transparent 60%),
                radial-gradient(ellipse at 80% 70%, #1a0f45, transparent 60%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-1));
    font-family:'Quicksand', sans-serif;
    color: var(--cream);
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
  }

  /* twinkling dreamy stars */
  .star{
    position:absolute;
    width:2px; height:2px;
    background: var(--cream);
    border-radius:50%;
    opacity:.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.6); }
  }

  /* center message */
  .center-message{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:5;
    pointer-events:none;
    padding: 0 20px;
    width: min(90vw, 640px);
  }
  .eyebrow{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-size:.75rem;
    color: var(--gold);
    margin-bottom: 14px;
    opacity:.9;
  }
  .headline{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-style:italic;
    font-size: clamp(2.4rem, 7vw, 5rem);
    line-height:1.02;
    margin:0;
    background: linear-gradient(100deg, var(--cream) 20%, var(--pink) 45%, var(--cyan) 65%, var(--cream) 85%);
    background-size: 300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shimmer 7s ease-in-out infinite, glow 3.2s ease-in-out infinite;
    text-shadow: 0 0 60px rgba(177,143,255,.35);
  }
  @keyframes shimmer{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }
  @keyframes glow{
    0%,100%{ filter: drop-shadow(0 0 18px rgba(255,46,158,.35)); }
    50%{ filter: drop-shadow(0 0 34px rgba(46,230,255,.45)); }
  }
  .sub-message{
    margin-top:18px;
    font-size: clamp(.95rem, 1.6vw, 1.15rem);
    font-weight:600;
    color: rgba(255,248,240,.85);
    letter-spacing:.01em;
  }
  .hint{
    margin-top: 26px;
    font-size:.8rem;
    font-weight:600;
    color: rgba(255,248,240,.55);
    letter-spacing:.08em;
  }

  /* bubbles */
  .bubble{
    position:absolute;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), rgba(255,255,255,.05) 40%),
                conic-gradient(from 180deg, var(--pink), var(--violet), var(--cyan), var(--gold), var(--pink));
    box-shadow:
      inset 0 0 20px rgba(255,255,255,.35),
      0 0 30px rgba(177,143,255,.35);
    will-change: left, top;
    transition: transform .5s cubic-bezier(.2,.9,.3,1.3), box-shadow .5s ease;
    overflow:hidden;
    z-index:2;
  }
  .bubble::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: linear-gradient(135deg, rgba(255,255,255,.5), transparent 40%, transparent 70%, rgba(255,255,255,.15));
    pointer-events:none;
  }
  .bubble .photo{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
    opacity:0;
    transform: scale(.7);
    transition: opacity .45s ease, transform .45s ease;
  }
  .bubble .label{
    position:absolute;
    bottom:-30px;
    left:50%;
    transform:translateX(-50%);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.06em;
    white-space:nowrap;
    color: var(--cream);
    opacity:0;
    transition: opacity .35s ease, bottom .35s ease;
    text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }

  .bubble:hover, .bubble.active{
    transform: scale(1.35);
    z-index:10;
    box-shadow:
      inset 0 0 20px rgba(255,255,255,.5),
      0 0 60px rgba(255,46,158,.55),
      0 0 90px rgba(46,230,255,.35);
    animation-play-state: paused;
  }
  .bubble:hover .photo, .bubble.active .photo{
    opacity:1;
    transform: scale(1);
  }
  .bubble:hover .label, .bubble.active .label{
    opacity:1;
    bottom:-26px;
  }

  @keyframes hue{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .bubble{ animation: none !important; }
    .headline, .star{ animation: none !important; }
  }

  @media (max-width: 640px){
    .hint{ display:none; }
  }

  .play-btn{
    pointer-events:auto;
    margin-top: 28px;
    background: rgba(255,248,240,.08);
    border: 1.5px solid rgba(255,248,240,.35);
    color: var(--cream);
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:.85rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding: 12px 26px;
    border-radius: 999px;
    cursor:pointer;
    backdrop-filter: blur(6px);
    transition: transform .3s ease, background .3s ease, border-color .3s ease, box-shadow .3s ease;
    box-shadow: 0 0 0 rgba(255,46,158,0);
  }
  .play-btn:hover{
    background: rgba(255,248,240,.16);
    border-color: var(--gold);
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 30px rgba(255,217,61,.35);
  }
  .play-btn:active{
    transform: translateY(0) scale(.97);
  }
  .play-btn.played{
    border-color: var(--pink);
  }
  .play-icon{
    display:inline-block;
    margin-right:6px;
    font-size:.7rem;
    transform: translateY(-1px);
  }

  #confettiCanvas{
    position:fixed;
    inset:0;
    width:100vw; height:100vh;
    pointer-events:none;
    z-index:20;
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="center-message">
    <div class="eyebrow">A little something for you</div>
    <h1 class="headline">Happy Birthday<br>Debbie!!</h1>
    <p class="sub-message">Wishing you a fruitful year of grace and joy! Have a happy birthday!! Many more years to come!</p>
    <p class="sub-message">From your siblings! ❤️</p>
    <p class="hint">✦ hover the bubbles ✦</p>

    <button class="play-btn" id="playBtn" type="button" aria-label="Tap for a surprise">
      <span class="play-icon">▶</span> tap to pop confetti!!
    </button>
  </div>

  <canvas id="confettiCanvas"></canvas>

</div>

  // keep-out zone around the center message so bubbles don't spawn on top of the text
  const centerBox = { xMin: W*0.5 - 340, xMax: W*0.5 + 340, yMin: H*0.5 - 220, yMax: H*0.5 + 220 };

  function randomPosition(size){
    let x, y, tries = 0;
    do{
      x = Math.random() * (W - size);
      y = Math.random() * (H - size);
      tries++;
    } while (
      x + size > centerBox.xMin && x < centerBox.xMax &&
      y + size > centerBox.yMin && y < centerBox.yMax &&
      tries < 40
    );
    return { x, y };
  }

  const liveBubbles = [];

  bubbles.forEach((b, i) => {
    const size = 90 + Math.random() * 70; // 90 - 160px
    const { x, y } = randomPosition(size);

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.animationDelay = (Math.random()*4) + 's';
    el.style.animationDuration = (8 + Math.random()*8) + 's';

    const img = document.createElement('img');
    img.className = 'photo';
    img.src = b.src;
    img.alt = b.label;

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = b.label;

    el.appendChild(img);
    el.appendChild(label);

    // touch support: tap toggles active state
    el.addEventListener('click', () => {
      document.querySelectorAll('.bubble.active').forEach(other => {
        if (other !== el) other.classList.remove('active');
      });
      el.classList.toggle('active');
    });

    let paused = false;
    el.addEventListener('mouseenter', () => paused = true);
    el.addEventListener('mouseleave', () => paused = false);

    stage.appendChild(el);

    // random gentle direction & speed, pixels per second
    const angle = Math.random() * Math.PI * 2;
    const speed = 10 + Math.random() * 16; // 10-26 px/s
    liveBubbles.push({
      el, x, y, size,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.6 + Math.random() * 0.6,
      get paused(){ return paused; }
    });
  });

  // ---------- Tap to play: confetti + birthday jingle ----------
  const playBtn = document.getElementById('playBtn');
  const canvas = document.getElementById('confettiCanvas');
  const ctx2d = canvas.getContext('2d');
  let confettiPieces = [];
  let confettiRunning = false;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const confettiColors = ['#ff2e9e', '#2ee6ff', '#ffd93d', '#b18fff', '#fff8f0'];

  function launchConfetti(){
    const count = 140;
    confettiPieces = [];
    for(let i=0;i<count;i++){
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        w: 6 + Math.random()*6,
        h: 8 + Math.random()*10,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        vy: 2 + Math.random()*3,
        vx: (Math.random()-0.5) * 2,
        rot: Math.random()*Math.PI*2,
        vRot: (Math.random()-0.5) * 0.2,
        life: 0,
        maxLife: 240 + Math.random()*80
      });
    }
    if (!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(confettiTick);
    }
  }

  function confettiTick(){
    ctx2d.clearRect(0,0,canvas.width, canvas.height);
    let alive = false;
    confettiPieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;
      p.life++;
      if (p.life < p.maxLife && p.y < canvas.height + 30){
        alive = true;
        const fade = p.life > p.maxLife - 40 ? Math.max(0, (p.maxLife - p.life) / 40) : 1;
        ctx2d.save();
        ctx2d.globalAlpha = fade;
        ctx2d.translate(p.x, p.y);
        ctx2d.rotate(p.rot);
        ctx2d.fillStyle = p.color;
        ctx2d.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx2d.restore();
      }
    });
    if (alive){
      requestAnimationFrame(confettiTick);
    } else {
      confettiRunning = false;
      ctx2d.clearRect(0,0,canvas.width, canvas.height);
    }
  }

    playBtn.classList.add('played');
    playBtn.querySelector('.play-icon').textContent = '✦';
    playBtn.lastChild.textContent = ' happy birthday, debbie!';
  });

  let lastTime = performance.now();
  function tick(now){
    const dt = Math.min((now - lastTime) / 1000, 0.05); // seconds, clamp for tab-switch jumps
    lastTime = now;
    const stageW = window.innerWidth;
    const stageH = window.innerHeight;

    liveBubbles.forEach(bub => {
      if (!bub.paused){
        bub.x += bub.vx * dt;
        bub.y += bub.vy * dt;

        // bounce off edges
        if (bub.x <= 0){ bub.x = 0; bub.vx = Math.abs(bub.vx); }
        if (bub.x + bub.size >= stageW){ bub.x = stageW - bub.size; bub.vx = -Math.abs(bub.vx); }
        if (bub.y <= 0){ bub.y = 0; bub.vy = Math.abs(bub.vy); }
        if (bub.y + bub.size >= stageH){ bub.y = stageH - bub.size; bub.vy = -Math.abs(bub.vy); }

        bub.wobblePhase += bub.wobbleSpeed * dt;
        const wobbleX = Math.sin(bub.wobblePhase) * 6;
        const wobbleY = Math.cos(bub.wobblePhase * 0.8) * 6;

        bub.el.style.left = (bub.x + wobbleX) + 'px';
        bub.el.style.top = (bub.y + wobbleY) + 'px';
      }
    });

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  for(let i=0;i<60;i++){
